<div class="settings-container max-w-md mx-auto mt-10 bg-white rounded-lg shadow-lg p-8">
    <h2 class="text-2xl font-bold mb-6 text-gray-800">Settings</h2>
    <form (submit)="saveConnectionString(connectionStringInput.value); $event.preventDefault();">
        <label for="connectionString" class="block text-gray-700 font-medium mb-2">Connection String:</label>
        <input
            id="connectionString"
            type="text"
            #connectionStringInput
            [value]="getConnectionString()"
            placeholder="Enter connection string"
            class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4"
        />
        <button
            type="submit"
            class="w-full bg-blue-600 text-white font-semibold py-2 rounded-md hover:bg-blue-700 transition-colors"
        >
            Save
        </button>
    </form>
</div>
