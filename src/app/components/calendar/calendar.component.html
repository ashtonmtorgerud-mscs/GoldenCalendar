<a routerLink="/" class="button absolute outline-red-500 text-white p-3 hover:bg-red-700 hover:font-bold rounded-lg select-none ">Back</a>


<div class="container mx-auto h-screen text-white select-none rounded">


        
        <div class="width-full bg-blue-950 rounded-lg border-8 border-blue-300 px-5 flex flex-row ">
                <div class="py-5">
                        <div class="float-left bg-black py-4 px-7 hoverPop rounded-full md:text-xl lg:text-5xl" (click)="GoToLastMonth()"> &#11164; </div>
                </div>
                <div class="mx-auto text-center text-xl md:text-4xl lg:text-8xl font-bold textOutliner bg-blue-300 m-3 p-2 w-4/5 rounded-4xl" style="height: calc(15%);">{{monthLong[today.getMonth()]}}  -  {{today.getFullYear()}}</div>
                <div class="py-5">
                        <div class="float-left bg-black py-4 px-7 hoverPop rounded-full text-lh md:text-xl lg:text-5xl" (click)="GoToNextMonth()"> &#11166; </div>
                </div>
        </div>


        <div class="w-full  p-1 flex flex-wrap rounded-lg">
                <div *ngFor="let day of weekShort;" class="flex-auto bg-blue-200 w-1/7 text-center ">
                        <div class="w-1/2 bg-blue-300 text-white font-bold mx-auto rounded-lg">
                                {{day}}
                        </div>
                </div>
        </div>


    <div class="flex flex-wrap gap-1" style="height: calc(80%);">
        <div *ngFor="let i of GetLastMonthDays(); let index = index;"  (click)="GoToLastMonth()"
        class="rounded-lg bg-gray-100 border-gray-400 border-7 text-black my-0 flex-auto max-w-md flex-shrink-0 w-1/8 outline-solid outline-black hover:outline-5 hover:outline-blue-300 hover:z-99 hover:rounded-lg hoverPop">    
                <div class="font-bold bg-gray-400 pb-1">
                        <p class="rounded-full bg-white w-7 h-7 text-center" >{{(i)}}</p>
                </div>
                <p *ngFor="let event of GetDayEvents(i)" class="px-1 font-bold hidden md:block">•{{event}}</p>
                <p *ngFor="let event of GetDayEvents(i)" class="px-1 font-bold block md:hidden text-red-500">•</p>
        </div>
        <div *ngFor="let i of GetThisMonthDays(); let index = index;" routerLink="/day/{{today.getFullYear()}}/{{today.getMonth()}}/{{i}}"
        class="bg-white rounded-lg border-7 text-black my-0 flex-auto max-w-md flex-shrink-0 w-1/8 outline-solid outline-black hover:outline-5 hover:outline-blue-300 hover:z-99 hover:rounded-lg hoverPop"
        [ngClass]="{'border-teal-400': proofMonthTime(i), 'border-blue-300': proofMonthTime(i) === false}">
                
                <div class="font-bold pb-1" [ngClass]="{'bg-teal-400': proofMonthTime(i), 'bg-blue-300': proofMonthTime(i) !== true}">
                <p class="rounded-full bg-white w-7 h-7 text-center">{{(i)}}</p>
                </div>
                <p *ngFor="let event of GetDayEvents(i)" class="px-1 font-bold hidden md:block">•{{event}}</p>
                <p *ngIf="GetDayEvents(i).length > 0" class="px-1 font-bold block md:hidden">•{{GetDayEvents(i).length}} Events</p>
        </div>
        <div *ngFor="let i of GetNextMonthDays(); let index = index;" 
        class="rounded-lg bg-gray-100 border-gray-400 border-7 text-black my-0 flex-auto max-w-md flex-shrink-0 w-1/8 outline-solid outline-black hover:outline-5 hover:outline-blue-300 hover:z-99 hover:rounded-lg hoverPop" (click)="GoToNextMonth()">    
                <div class="font-bold bg-gray-400 pb-1">
                        <p class="rounded-full bg-white w-7 h-7 text-center">{{(i)}}</p>
                </div>
                <p *ngFor="let event of GetDayEvents(i)" >{{event}}</p>
        </div>
    </div>
      

</div>
